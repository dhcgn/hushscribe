name: Deploy to GitHub Pages

# Releases only. A commit on main is not a version, so it does not get published
# — tag it and write the release notes, and that tag is what the site reports.
# Pull requests get a throwaway copy under /pr/<n>/ so a change can be clicked
# through before it is tagged.
on:
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write        # pushes the built site to the gh-pages branch
  pull-requests: write   # leaves the preview link on the PR

# Every run here pushes to the same branch, so they must not overlap. Never
# cancelled: a cancelled cleanup would strand a preview directory forever.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A fork PR gets a read-only GITHUB_TOKEN, so the push could only ever fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      # One workflow, three cases: a tag publishes to the site root, a pull
      # request to pr/<n>/, and closing that pull request deletes it again.
      # `workflow_dispatch` is for re-publishing a tag — run it from one, or the
      # footer link points at a release that does not exist.
      - id: target
        env:
          PR: ${{ github.event.number }}
          REF: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PR" ]; then
            {
              echo "dir=pr/$PR"
              echo "base=/$REPO/pr/$PR/"
              echo "version=PR #$PR"
              echo "link=${{ github.event.pull_request.html_url }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "dir="
              echo "base=/$REPO/"
              echo "version=$REF"
              echo "link=${{ github.server_url }}/${{ github.repository }}/releases/tag/$REF"
            } >> "$GITHUB_OUTPUT"
          fi

      # test-data/ is ~83 MB of real speech used only by the opt-in smoke suite.
      # Non-cone sparse checkout keeps it out of the working tree, and checkout
      # pairs that with a blobless partial clone, so the bytes are never fetched.
      - uses: actions/checkout@v4
        if: github.event.action != 'closed'
        with:
          sparse-checkout: |
            /*
            !/test-data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      # Gate the release on the tests, so a tag can never publish a broken page.
      # Previews skip it: ci.yml already runs the same command on the same commit.
      - run: npm run coverage
        if: github.event_name != 'pull_request'

      - name: Build
        if: github.event.action != 'closed'
        run: npm run build
        env:
          # A project site lives at /<repo>/, a preview one level deeper. Set
          # BASE_PATH to / if you move this to a custom domain.
          BASE_PATH: ${{ steps.target.outputs.base }}
          APP_VERSION: ${{ steps.target.outputs.version }}
          APP_VERSION_URL: ${{ steps.target.outputs.link }}

      # Publishes dist/coverage.json for the shields.io endpoint badge. Must run
      # after the build, which creates dist/.
      - name: Publish the coverage badge endpoint
        if: github.event_name != 'pull_request'
        run: npm run coverage:badge

      # A key baked into a static bundle deployed to a public Pages site is a
      # published key. This turns that policy into an enforced invariant.
      #
      # Privatemode keys are UUIDs, not the `pm-…` shape index.html's
      # placeholder suggests. The first version of this grep matched only `pm-`,
      # so it could never have fired on a real key — the negative control that
      # "proved" it worked was a `pm-` string too. Both shapes are checked now.
      # The one permitted hit is openai's randomUUID polyfill template: a
      # published constant, not a secret.
      - name: Assert no API key reached the bundle
        if: github.event.action != 'closed'
        run: |
          hits=$(grep -rIoE 'pm-[A-Za-z0-9_-]{12,}|[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' dist/ | grep -v '10000000-1000-4000-8000-100000000000' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::An API-key-shaped string is present in dist/. Refusing to deploy."
            exit 1
          fi
          echo "No key-shaped strings in dist/."

      # Pages serves the gh-pages branch, so publishing is a commit: production
      # at the root, previews under pr/. Deleting a preview is the same step
      # with no dist/ to copy in.
      - name: Publish to gh-pages
        env:
          DIR: ${{ steps.target.outputs.dir }}
          MSG: ${{ steps.target.outputs.version }}${{ github.event.action == 'closed' && ' (removed)' || '' }}
        run: |
          remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone --depth 1 --branch gh-pages "$remote" pages 2>/dev/null \
            || { git init -q -b gh-pages pages && git -C pages remote add origin "$remote"; }

          if [ -n "$DIR" ]; then
            rm -rf "pages/$DIR"
          else
            # A release replaces the site but must leave open previews standing.
            find pages -mindepth 1 -maxdepth 1 -not -name .git -not -name pr -exec rm -rf {} +
          fi
          if [ -d dist ]; then
            mkdir -p "pages/$DIR"
            cp -a dist/. "pages/$DIR"
          fi
          # Without this, Pages runs Jekyll and drops any file starting with _.
          touch pages/.nojekyll

          cd pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "$MSG" || { echo 'Nothing changed.'; exit 0; }
          git push -q origin gh-pages

      # One comment per PR, rewritten in place — `--edit-last` fails the first
      # time round, and the fallback posts it.
      - name: Point the pull request at its preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          BODY: ${{ github.event.action == 'closed'
                    && 'Preview removed.'
                    || format('Preview of this PR: https://{0}.github.io/{1}/pr/{2}/',
                              github.repository_owner, github.event.repository.name, github.event.number) }}
        run: gh pr comment "$PR" --edit-last --body "$BODY" || gh pr comment "$PR" --body "$BODY"
