name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # test-data/ is ~83 MB of real speech used only by the opt-in smoke suite.
      # Non-cone sparse checkout keeps it out of the working tree, and checkout
      # pairs that with a blobless partial clone, so the bytes are never fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/test-data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the tests, so main can never publish a broken page.
      - run: npm run test:unit

      - name: Build
        # A project site lives at /<repo>/. Set BASE_PATH to / if you move this
        # to a custom domain.
        run: npm run build
        env:
          BASE_PATH: /hushscribe/

      - name: Assert no API key reached the bundle
        run: |
          if grep -rIlE 'pm-[A-Za-z0-9_-]{12,}' dist/; then
            echo "::error::An API-key-shaped string is present in dist/. Refusing to deploy."
            exit 1
          fi

      # enablement turns Pages on via the API if it is not already configured.
      # Without it the first deploy of a fresh repo fails with "Get Pages site
      # failed", and the fix is a manual settings click nobody documents.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
