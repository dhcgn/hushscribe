name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # test-data/ is ~83 MB of real speech used only by the opt-in smoke suite.
      # Non-cone sparse checkout keeps it out of the working tree, and checkout
      # pairs that with a blobless partial clone, so the bytes are never fetched.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/test-data
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the tests, so main can never publish a broken page.
      - run: npm run coverage

      - name: Build
        # A project site lives at /<repo>/. Set BASE_PATH to / if you move this
        # to a custom domain.
        run: npm run build
        env:
          BASE_PATH: /hushscribe/

      # Publishes dist/coverage.json for the shields.io endpoint badge. Must run
      # after the build, which creates dist/.
      - name: Publish the coverage badge endpoint
        run: npm run coverage:badge

      # A key baked into a static bundle deployed to a public Pages site is a
      # published key. This turns that policy into an enforced invariant.
      #
      # Privatemode keys are UUIDs, not the `pm-…` shape index.html's
      # placeholder suggests. The first version of this grep matched only `pm-`,
      # so it could never have fired on a real key — the negative control that
      # "proved" it worked was a `pm-` string too. Both shapes are checked now.
      # The one permitted hit is openai's randomUUID polyfill template: a
      # published constant, not a secret.
      - name: Assert no API key reached the bundle
        run: |
          hits=$(grep -rIoE 'pm-[A-Za-z0-9_-]{12,}|[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' dist/ | grep -v '10000000-1000-4000-8000-100000000000' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::An API-key-shaped string is present in dist/. Refusing to deploy."
            exit 1
          fi
          echo "No key-shaped strings in dist/."

      # Pages must already be enabled with Source = GitHub Actions, or this step
      # fails with "Get Pages site failed" on a fresh repo. `enablement: true`
      # does NOT fix that: GITHUB_TOKEN cannot create a Pages site and the call
      # returns "Resource not accessible by integration". It is a one-time
      # repository-owner action, documented in the README:
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
